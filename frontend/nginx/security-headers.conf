# Included in every location that sets its own headers (nginx does not inherit add_header into such locations).
# script-src / frame-src / connect-src / img-src / form-action also allow Razorpay Checkout (the card, UPI and bank
# details are typed into Razorpay's own window, never into our pages). frame-src also allows the OpenStreetMap embed
# on hotel pages.
# microphone=(self): the AI assistant's voice questions (our own pages only; the browser still asks the user, and
# no embedded frame may use it). media-src 'self' blob:: the assistant reads answers aloud from an MP3 the page
# receives from /api/assistant/voice/speech and plays from a blob: URL.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self), payment=(self)" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.razorpay.com; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' https://lumberjack.razorpay.com https://checkout.razorpay.com; frame-src https://www.openstreetmap.org https://api.razorpay.com https://checkout.razorpay.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://api.razorpay.com" always;
