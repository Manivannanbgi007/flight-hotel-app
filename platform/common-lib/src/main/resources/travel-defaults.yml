# -----------------------------------------------------------------------------
# Defaults shared by every business service.
# Loaded automatically with the LOWEST precedence by TravelDefaultsEnvironmentPostProcessor,
# so a service's application.yml only adds what is specific to it (name, port, database,
# public paths) and can override anything here.
#
# Every value can be overridden by an environment variable, e.g. KAFKA_BOOTSTRAP_SERVERS.
# -----------------------------------------------------------------------------
spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${travel.db.name}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true
    username: ${travel.db.username}
    password: ${travel.db.password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        type:
          # Store java.time.Instant in DATETIME(6) columns (always UTC, see jdbc.time_zone).
          preferred_instant_jdbc_type: TIMESTAMP
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        schema.registry.url: ${travel.kafka.schema-registry-url}
        specific.avro.reader: true
        isolation.level: read_committed
    producer:
      acks: all
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record
      missing-topics-fatal: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  mvc:
    problemdetails:
      # OFF on purpose: common-lib's GlobalExceptionHandler already produces Problem Details (with our "code" and
      # "correlationId"). Spring Boot's own handler would otherwise win for framework errors (bad JSON, validation).
      enabled: false
  jackson:
    deserialization:
      # Jackson 3 rejects a missing/null JSON value for a primitive field. Optional flags such as "rememberMe"
      # simply default to false.
      fail-on-null-for-primitives: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

travel:
  kafka:
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
  security:
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8101/.well-known/jwks.json}
    issuer: ${JWT_ISSUER:flight-hotel-identity}

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  level:
    root: INFO
    com.flighthotel: INFO
    org.apache.kafka: WARN
    io.confluent: WARN

---
# Containers and production: one JSON object per log line (ECS format) for log aggregation.
spring:
  config:
    activate:
      on-profile: docker,prod
logging:
  structured:
    format:
      console: ecs

---
spring:
  config:
    activate:
      on-profile: prod
travel:
  kafka:
    # In production CI registers schemas; services must not change the registry.
    auto-register-schemas: false
springdoc:
  swagger-ui:
    enabled: false
