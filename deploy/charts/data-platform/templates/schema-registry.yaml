{{- if .Values.schemaRegistry.enabled }}
{{- $ctx := dict "root" . "name" "schema-registry" }}
# Confluent Schema Registry: the Avro schemas of every event (backward-compatible changes only).
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  labels: {{- include "dp.labels" $ctx | nindent 4 }}
spec:
  selector: {{- include "dp.selector" $ctx | nindent 4 }}
  ports:
    - { name: http, port: 8081, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  labels: {{- include "dp.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "dp.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "dp.labels" $ctx | nindent 8 }}
    spec:
      # Required: SCHEMA_REGISTRY_PORT=tcp://... from service links would be read as a registry setting.
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: schema-registry
          image: {{ include "dp.image" (dict "root" . "image" .Values.schemaRegistry.image) }}
          ports:
            - { name: http, containerPort: 8081 }
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - { name: SCHEMA_REGISTRY_LISTENERS, value: "http://0.0.0.0:8081" }
            - { name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS, value: "PLAINTEXT://kafka.{{ .Release.Namespace }}.svc.cluster.local:9092" }
            - { name: SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL, value: "backward" }
            - { name: SCHEMA_REGISTRY_HEAP_OPTS, value: "-Xms128m -Xmx256m" }
          startupProbe:
            httpGet: { path: /subjects, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /subjects, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /subjects, port: http }
            periodSeconds: 20
            failureThreshold: 6
          resources: {{- toYaml .Values.schemaRegistry.resources | nindent 12 }}
          {{- include "dp.containerSecurity" . | nindent 10 }}
{{- end }}
