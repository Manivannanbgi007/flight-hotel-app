{{- if .Values.redis.enabled }}
{{- $ctx := dict "root" . "name" "redis" }}
# Redis 8: rate limits, token revocation, short-lived caches. No persistence (as in Docker Compose).
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {{- include "dp.labels" $ctx | nindent 4 }}
spec:
  selector: {{- include "dp.selector" $ctx | nindent 4 }}
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {{- include "dp.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "dp.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "dp.labels" $ctx | nindent 8 }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: {{ include "dp.image" (dict "root" . "image" .Values.redis.image) }}
          args: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "{{ .Values.redis.maxMemory }}", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 20
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          {{- include "dp.containerSecurity" . | nindent 10 }}
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: { sizeLimit: 64Mi }
{{- end }}
