{{- if .Values.resourceQuota.enabled }}
# A ceiling for the whole namespace (a runaway autoscaler or rollout cannot starve the cluster).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: flight-hotel-quota
spec:
  hard:
    {{- toYaml .Values.resourceQuota.hard | nindent 4 }}
{{- end }}
{{- if .Values.limitRange.enabled }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: flight-hotel-defaults
spec:
  limits:
    - type: Container
      default:
        {{- toYaml .Values.limitRange.default | nindent 8 }}
      defaultRequest:
        {{- toYaml .Values.limitRange.defaultRequest | nindent 8 }}
      max:
        {{- toYaml .Values.limitRange.max | nindent 8 }}
{{- end }}
