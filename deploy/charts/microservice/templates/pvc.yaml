{{- if .Values.persistence.enabled }}
# Local file storage (travel.storage.type=local). ReadWriteOnce: new pods of a rollout start on the same node as the
# volume. Production (EKS) uses S3 instead and turns this off, so pods can run on any node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ms.name" . }}-storage
  labels:
    {{- include "ms.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep    # uninstalling the service never deletes its files
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.global.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
