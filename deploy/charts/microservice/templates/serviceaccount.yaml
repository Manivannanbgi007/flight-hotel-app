# One identity per service (on EKS: annotate it with an IAM role, e.g. for S3 through IRSA / Pod Identity).
# The services never call the Kubernetes API, so no token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ms.name" . }}
  labels:
    {{- include "ms.labels" . | nindent 4 }}
  {{- with .Values.serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
