{{- if .Values.route.enabled }}
{{- $name := include "ms.name" . -}}
{{- $port := include "ms.port" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "ms.labels" . | nindent 4 }}
spec:
  # group/kind are the API defaults, written out so that Argo CD's diff matches the live object exactly.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.global.gateway.name }}
      namespace: {{ .Values.global.gateway.namespace }}
  hostnames:
    {{- toYaml .Values.route.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.route.pathPrefix }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ $name }}
          port: {{ $port }}
          {{- if and (eq .Values.strategy.type "canary") .Values.strategy.canary.trafficRouting }}
          weight: 100
        # Argo Rollouts moves the weight between these two during a canary (the Argo CD application ignores it).
        - group: ""
          kind: Service
          name: {{ $name }}-canary
          port: {{ $port }}
          weight: 0
          {{- end }}
{{- if and (eq .Values.strategy.type "blueGreen") .Values.route.previewHostnames }}
---
# The new version before promotion, for checking it by hand (blue-green).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}-preview
  labels:
    {{- include "ms.labels" . | nindent 4 }}
spec:
  # group/kind are the API defaults, written out so that Argo CD's diff matches the live object exactly.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.global.gateway.name }}
      namespace: {{ .Values.global.gateway.namespace }}
  hostnames:
    {{- toYaml .Values.route.previewHostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.route.pathPrefix }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ $name }}-preview
          port: {{ $port }}
{{- end }}
{{- end }}
