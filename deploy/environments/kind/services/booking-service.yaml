# booking-service: Bookings and the booking saga, coupons, offers, cancellations.
containerPort: 8104
env:
  SERVER_PORT: "8104"
  DEV_SEED_ENABLED: "true"
secretEnv:
  BOOKING_DB_PASSWORD: BOOKING_DB_PASSWORD
  DATA_ENCRYPTION_KEY: DATA_ENCRYPTION_KEY
strategy:
  type: canary
  canary:
    trafficRouting: false     # inside the cluster: the share of pods decides the share of requests
    steps:
      - setWeight: 50         # one new pod next to the stable one
      - pause: { duration: 20s }
      - smokeTest: true       # its readiness endpoint, three times; a failure rolls back
      - pause: { duration: 20s }
