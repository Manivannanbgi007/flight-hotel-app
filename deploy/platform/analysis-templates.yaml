# Checks Argo Rollouts runs before a new version gets traffic (canary) or becomes active (blue-green).
# A Job in the application's namespace calls the new version's own service (the canary or preview service, which
# only reaches the new pods) three times; one failure aborts the rollout and traffic stays on the stable version.
apiVersion: argoproj.io/v1alpha1
kind: ClusterAnalysisTemplate
metadata:
  name: http-smoke-test
spec:
  args:
    - name: url            # e.g. http://booking-service-canary.flight-hotel.svc.cluster.local:8104/actuator/health/readiness
  metrics:
    - name: http-smoke-test
      count: 3
      interval: 10s
      failureLimit: 0
      provider:
        job:
          spec:
            backoffLimit: 1
            activeDeadlineSeconds: 90
            ttlSecondsAfterFinished: 600
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: smoke-test
                  app.kubernetes.io/part-of: flight-hotel
              spec:
                restartPolicy: Never
                automountServiceAccountToken: false
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 100
                  runAsGroup: 101
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: curl
                    image: curlimages/curl:8.17.0
                    args: ["-fsS", "--max-time", "10", "--retry", "5", "--retry-delay", "3", "--retry-all-errors", "{{args.url}}"]
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: ["ALL"]
                    resources:
                      requests: { cpu: 10m, memory: 16Mi }
                      limits: { memory: 32Mi }
