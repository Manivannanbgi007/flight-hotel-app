# Routes for the platform UIs (Argo CD's own route comes from its chart values).
#   http://rollouts.localhost   Argo Rollouts dashboard
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-rollouts-dashboard
  namespace: argo-rollouts
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - rollouts.localhost
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: argo-rollouts-dashboard
          port: 3100
